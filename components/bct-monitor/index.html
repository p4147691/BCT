<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BCT Monitor</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Noto Sans KR",system-ui,sans-serif;background:#0b1020;color:#eef2ff}
    body{margin:0;padding:24px;background:radial-gradient(circle at top left,#18213c,#0b1020 55%);min-height:100vh}
    header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}h1{margin:0;font-size:26px}small{color:#94a3b8}
    #status{padding:7px 11px;border-radius:999px;background:#183527;color:#7ef0a8;font-weight:700}.bad{background:#421d25!important;color:#ff9ca8!important}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#121a2d;border:1px solid #283552;border-radius:14px;padding:15px;box-shadow:0 10px 30px #0004}.label{color:#93a4c3;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:22px;font-weight:750;margin-top:7px;overflow-wrap:anywhere}
    section{margin-top:18px}.table{overflow:auto;background:#11192a;border:1px solid #283552;border-radius:14px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #202c46;white-space:nowrap}th{color:#9fb1d2}.ok{color:#78efa1}.warn{color:#ffd36e}.failed{color:#ff8d9c}
  </style>
</head>
<body>
  <header><div><h1>BCT Monitor</h1><small>단일 BCT runtime · 읽기 전용 관제</small></div><div id="status">연결 중</div></header>
  <div class="grid" id="summary"></div>
  <section><h2>최근 작업</h2><div class="table"><table><thead><tr><th>작업</th><th>상태</th><th>요청</th></tr></thead><tbody id="works"></tbody></table></div></section>
  <section><h2>최근 실행</h2><div class="table"><table><thead><tr><th>실행</th><th>기능</th><th>결과</th><th>대상</th></tr></thead><tbody id="operations"></tbody></table></div></section>
  <script>
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const card=(label,value)=>`<article class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></article>`;
    async function refresh(){const badge=document.querySelector('#status');try{const r=await fetch('/monitor/state',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();badge.textContent=`LIVE · ${d.service.release_sha.slice(0,8)}`;badge.className='';const c=d.counts;document.querySelector('#summary').innerHTML=[card('BCT','PID '+d.service.pid),card('Local LLM',`${d.decision.state} · PID ${d.decision.pid??'-'}`),card('RCC',`${c.rcc_instances} instance`),card('작업',c.works),card('실행',c.operations),card('미해결 충돌',c.unresolved_claims),card('프로세스 세션',c.process_sessions)].join('');document.querySelector('#works').innerHTML=d.works.slice(0,20).map(x=>`<tr><td>${esc(x.work_id)}</td><td>${esc(x.state)}</td><td>${esc(x.request_summary)}</td></tr>`).join('')||'<tr><td colspan="3">기록 없음</td></tr>';document.querySelector('#operations').innerHTML=d.operations.slice(0,30).map(x=>`<tr><td>${esc(x.operation_id)}</td><td>${esc(x.capability)}</td><td class="${x.outcome==='APPLIED'?'ok':x.state==='RUNNING'?'warn':'failed'}">${esc(x.outcome||x.state)}</td><td>${esc(x.target)}</td></tr>`).join('')||'<tr><td colspan="4">기록 없음</td></tr>';}catch(e){badge.textContent='연결 끊김 · '+e.message;badge.className='bad';}}
    refresh();setInterval(refresh,3000);
  </script>
</body>
</html>
