<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BCT Window Monitor</title>
  <link rel="stylesheet" href="desktop.css">
  <link rel="stylesheet" href="monitor.css">
</head>
<body>
  <div class="desktop-actions">
    <div class="desktop-actions-main">
      <span id="desktopNumber" class="desktop-number" hidden></span>
      <span id="status" role="status">불러오는 중…</span>
      <button id="refreshButton" type="button" title="새로고침" aria-label="새로고침">↻</button>
    </div>
    
  </div>

  <main>
    <div id="folderNav" class="folder-nav" hidden>
      <div class="folder-nav-icon" aria-hidden="true"><span class="folder-tab"></span></div>
      <button id="folderBack" type="button" title="뒤로" aria-label="뒤로">←</button>
      <button id="folderUp" type="button" title="상위 폴더" aria-label="상위 폴더">↑</button>
      <div class="folder-nav-meta">
        <span id="folderName" class="folder-name"></span>
        <span id="folderPath" title=""></span>
      </div>
    </div>
    <div id="errorPanel" class="error-panel" hidden></div>
    <div id="desktopGrid" class="desktop-grid" aria-label="바탕화면 항목"></div>
    <div id="emptyPanel" class="empty-panel" hidden>표시할 바탕화면 항목이 없습니다.</div>
  </main>

  <div id="selectionBox" class="selection-box" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <section id="textViewer" class="text-viewer" aria-label="텍스트 보기" hidden>
    <header class="text-viewer-header">
      <div>
        <strong id="textViewerName"></strong>
        <span id="textViewerPath"></span>
      </div>
      <button id="textViewerClose" type="button" aria-label="텍스트 보기 닫기">×</button>
    </header>
    <textarea id="textViewerContent" readonly spellcheck="false" aria-label="파일 내용"></textarea>
  </section>

  <script src="desktop.js"></script>
  <script src="monitor-act-transport.js"></script>
  <script src="monitor-thumbnail-service.js"></script>
  <script src="monitor-bct-shell.js"></script>
  <script src="monitor-native-trace.js"></script>
  <script src="monitor-provider-launch-queue.js"></script>
  <script src="monitor-context-resume.js"></script>
  <script src="monitor-project-context-recall.js"></script>
  <script src="monitor-work-recovery.js"></script>
<script src="monitor.js"></script>
  <script src="desktop-window-chrome.js"></script>
</body>
</html>
