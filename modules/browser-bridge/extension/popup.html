<!doctype html><html lang="ko"><meta charset="utf-8"><title>BCT Browser Bridge</title><body>
<button id="enable">현재 Chat 대화에서 BCT 제어 활성화</button>
<button id="list">BCT 도구 목록</button>
<label>도구 <input id="tool" size="32" placeholder="bct_status"></label>
<label>JSON 인수 <textarea id="arguments" rows="5" cols="48">{"compact":true}</textarea></label>
<button id="call">도구 호출</button>
<details><summary>이전 읽기 호환 기능</summary><label>경로 <input id="path" size="40"></label><button id="read">READ</button><label>Operation ID <input id="operationId" size="36"></label><button id="lookup">영수증 조회</button></details>
<pre id="result"></pre><script src="popup.js"></script></body></html>
