[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bct-control"
version = "0.6.0"
description = "An independent user-directed development and desktop control package"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "mcp>=1.26,<2",
  "psutil>=7,<8",
  "uvicorn>=0.41,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
