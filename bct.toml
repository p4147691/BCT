[policy]
normal_actions = [
  "read",
  "write",
  "test",
  "verify",
  "git_commit",
  "github_push",
  "github_pr_create",
  "github_pr_status",
  "github_pr_merge",
  "github_sync_main",
  "deploy",
  "service_control",
  "relay_browser",
  "system_inspect",
  "execute",
  "process_session",
  "decision_model",
  "monitor",
  "orchestrate",
  "decision_service",
]
approval_actions = ["delete", "credential_change"]

[execution.sessions]
state_root = "D:\\BCT\\data\\process-sessions"

[decision]
endpoint_file = "D:\\BCT\\data\\decision-endpoint.json"
timeout_s = 1.0

[decision.service]
