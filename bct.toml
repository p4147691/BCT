[policy]
normal_actions = [
  "read",
  "write",
  "test",
  "git_commit",
  "github_push",
  "github_pr_create",
  "github_pr_status",
  "github_pr_merge",
  "github_sync_main",
  "deploy",
  "service_control",
  "relay_browser",
  "system_inspect",
  "execute",
  "process_session",
  "decision_model",
  "monitor",
  "decision_service",
]
approval_actions = ["delete", "credential_change"]

[execution.sessions]
state_root = "D:\\BCT\\data\\process-sessions"

[decision]
endpoint_file = "D:\\BCT\\data\\decision-endpoint.json"
timeout_s = 1.0

[decision.service]
state_root = "D:\\BCT\\data"
model_path = "D:\\BCT\\models\\act-laya-v2"
model_name = "act-laya-v2"
model_sha256 = "0B34911A3D48C38AEB7B6A0C9AB972DF8EEE50C567AEDD907F3115F2D5079280"
port = 18771
python = "C:\\Users\\시우세영\\AppData\\Local\\Programs\\Python\\Python312\\python.exe"
python_paths = [
  "D:\\BCT\\local-llm\\laya-0.4.3",
  "D:\\BCT\\local-llm\\deps",
]
module = "laya.serve"
readiness_timeout = 60.0

[monitor]
source_root = "components/monitor"
live_root = "D:\\ChromeExtensions\\DesktopWindow-Monitor"

