[policy]
normal_actions = [
  "read",
  "write",
  "test",
  "verify",
  "git_commit",
  "github_push",
  "github_pr_create",
  "github_pr_status",
  "github_pr_merge",
  "github_sync_main",
  "deploy",
  "service_control",
  "relay_browser",
  "system_inspect",
  "execute",
  "process_session",
  "monitor",
  "orchestrate",
]
approval_actions = ["delete", "credential_change"]

[orchestration]
# Emergency stop for durable Manager/Worker collaboration. When enabled, only
# sessions created afterwards use Schema 2; existing sessions stay pinned to
# their stored legacy receipt mode.
manager_wake_receipt_v2_enabled = true

[execution.sessions]
state_root = "D:\\BCT\\data\\process-sessions"


[monitor]
source_root = "modules/monitor"
canonical_source_root = "D:\\BCT\\source"
live_root = "D:\\ChromeExtensions\\DesktopWindow-Monitor"

[deployment.profiles.bct_runtime_v1]
source_root = "D:\\BCT\\source"
runtime_root = "D:\\BCT\\runtime"
service_name = "bct-core"
port = 18790
files = [
  "bct.toml",
  "src/bct/__init__.py",
  "src/bct/service.py",
  "src/bct/service_runtime.py",
