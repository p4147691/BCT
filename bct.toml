[policy]
normal_actions = [
  "read",
  "write",
  "test",
  "verify",
  "git_commit",
  "github_push",
  "github_pr_create",
  "github_pr_status",
  "github_pr_merge",
  "github_sync_main",
  "deploy",
  "service_control",
  "relay_browser",
  "system_inspect",
  "cdp_inspect",
  "execute",
  "process_session",
  "monitor",
  "orchestrate",
  "desktop_session_status",
  "desktop_capture",
  "desktop_explore",
  "desktop_application_target",
  "desktop_chrome_content_list",
  "desktop_chrome_content_action",
  "desktop_uia_elements_list",
  "desktop_uia_element_action",
  "desktop_chrome_tab_reconcile",
  "desktop_chrome_tab_select",
  "desktop_control_lease",
  "desktop_emergency_stop",
  "desktop_input",
  "desktop_clipboard",
  "desktop_window_list",
  "desktop_window_activate",
  "desktop_window_activate_reconcile",
  "desktop_window_manage",
  "desktop_program_launch",
  "vtl_validate",
]
approval_actions = ["delete", "credential_change"]

# Chrome DevTools MCP is opt-in and never launched by starting BCT.
# Configure a pinned, trusted MCP command and enable only after review.
[cdp]
enabled = false
argv = []

[git_authority]
mode = "local"
repository = "p4147691/BCT"
source_root = "D:\\BCT\\source"

[orchestration]
# Emergency stop for durable Manager/Worker collaboration. When enabled, only
# sessions created afterwards use Schema 2; existing sessions stay pinned to
# their stored legacy receipt mode.
manager_wake_receipt_v2_enabled = true
# Emergency-only stable-instance retirement. Normal same-ID reloads are fenced
# by the exact current RCC session in SQLite, so they do not require a manual
# allow/deny edit and historical attachments remain audit-only.
excluded_new_assignment_instance_ids = []
# This stable extension identity is eligible after one exact live session has
# been observed by node-sync. A same-ID reload simply advances that session.
require_current_session_instance_ids = ["6174664e1c1b4e6db1d4729c841db3c9"]

[execution.sessions]
state_root = "D:\\BCT\\data\\process-sessions"

[desktop_session]
state_root = "D:\\BCT\\runtime\\desktop-session"
evidence_root = "D:\\BCT\\data\\desktop-session\\evidence"

[vtl]
current_pointer = "D:\\TOOLS\\VTL\\current.json"
evidence_root = "D:\\BCT\\data\\vtl-evidence"


[monitor]
source_root = "modules/monitor"
canonical_source_root = "D:\\BCT\\source"
live_root = "D:\\ChromeExtensions\\DesktopWindow-Monitor"

# Kept for a later, explicitly requested diagnostic experiment.  It is disabled
# in normal operation and must never participate in Manager↔Worker relay V0.
[bottleneck_ack]
enabled = false
threshold_seconds = 30
cooldown_seconds = 300
watch_instance_id = "6174664e1c1b4e6db1d4729c841db3c9"
watch_conversation_key = "6ad5afa4-b1e0-83ee-8692-aec4bb51523e"
probe_instance_id = "6174664e1c1b4e6db1d4729c841db3c9"
probe_conversation_key = "6ad69ba4-988c-83ee-971e-1ffef5465116"

[deployment.profiles.bct_runtime_v1]
source_root = "D:\\BCT\\source"
runtime_root = "D:\\BCT\\runtime"
service_name = "bct-core"
port = 18790
