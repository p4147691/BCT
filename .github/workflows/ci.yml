name: BCT CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bct-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: windows-latest
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      core: ${{ steps.plan.outputs.core }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Resolve exact validation scope
        id: plan
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            'skip=false' >> $env:GITHUB_OUTPUT
            'core=true' >> $env:GITHUB_OUTPUT
            Write-Output 'Manual dispatch: Core validation selected.'
            exit 0
          }
          $base = ''
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
          }
          elseif ('${{ github.event_name }}' -eq 'push') {
            $base = '${{ github.event.before }}'
          }
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $base = 'HEAD^'
          }
          git fetch --no-tags --depth=1 origin $base
          python scripts/ci_scope.py --base $base --head $env:GITHUB_SHA --github-output $env:GITHUB_OUTPUT

  preflight:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Compile and validate the CI planner first
        run: |
          python -m compileall -q src tests scripts
          python -m unittest discover -s tests -p test_ci_acceleration.py -v
  core:
    needs: [scope, preflight]
    if: needs.scope.outputs.core == 'true'
    runs-on: windows-latest
    strategy:
      # Keep every shard running so one failure yields a complete diagnosis and
      # does not force another push merely to discover a second failure.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Run BCT core shard ${{ matrix.shard }} of 4
        run: python scripts/ci_test_shard.py --start-directory tests --shard-index ${{ matrix.shard }} --shard-count 4 --durations 20 --duration-input scripts/ci_test_duration_seed.json
