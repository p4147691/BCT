name: BCT CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bct-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: windows-latest
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      core: ${{ steps.plan.outputs.core }}
      bridge: ${{ steps.plan.outputs.bridge }}
      vtl: ${{ steps.plan.outputs.vtl }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Resolve exact validation scope
        id: plan
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            'docs_only=false' >> $env:GITHUB_OUTPUT
            'core=true' >> $env:GITHUB_OUTPUT
            'bridge=true' >> $env:GITHUB_OUTPUT
            'vtl=true' >> $env:GITHUB_OUTPUT
            Write-Output 'Manual dispatch: all validation gates selected.'
            exit 0
          }
          $base = ''
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
          }
          elseif ('${{ github.event_name }}' -eq 'push') {
            $base = '${{ github.event.before }}'
          }
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $base = 'HEAD^'
          }
          git fetch --no-tags --depth=1 origin $base
          python scripts/ci_scope.py --base $base --head $env:GITHUB_SHA --github-output $env:GITHUB_OUTPUT

  preflight:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Compile and validate the CI planner first
        run: |
          python -m compileall -q src tests scripts modules/browser-bridge
          python -m unittest discover -s tests -p test_ci_acceleration.py -v
      - name: Fail fast on browser source-baseline drift
        if: needs.scope.outputs.bridge == 'true'
        run: python -m unittest discover -s tests -p test_browser_module_baselines.py -v

  core:
    needs: [scope, preflight]
    if: needs.scope.outputs.core == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Run BCT core shard ${{ matrix.shard }} of 4
        run: python scripts/ci_test_shard.py --start-directory tests --shard-index ${{ matrix.shard }} --shard-count 4 --durations 20

  browser-bridge:
    needs: [scope, preflight]
    if: needs.scope.outputs.bridge == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Build launcher before the fail-fast activation boundary
        run: dotnet build modules/browser-bridge/native/launcher/BctBridgeHost.csproj -c Release
      - run: python -m unittest discover -s modules/browser-bridge/tests -p activation_policy_windows_e2e.py -v
      - name: Remove only launcher artifacts created by the fail-fast build
        shell: pwsh
        run: |
          $launcherRoot = (Resolve-Path -LiteralPath "modules/browser-bridge/native/launcher").Path
          foreach ($leaf in @("bin", "obj")) {
            $candidate = Join-Path $launcherRoot $leaf
            if (-not (Test-Path -LiteralPath $candidate)) { continue }
            $resolved = (Resolve-Path -LiteralPath $candidate).Path
            $prefix = $launcherRoot + [IO.Path]::DirectorySeparatorChar
            if (-not $resolved.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Refusing to remove path outside launcher root."
            }
            Remove-Item -LiteralPath $resolved -Recurse -Force
          }
      - run: python -m unittest discover -s modules/browser-bridge/tests -v
      - name: Rebuild launcher for the remaining Windows E2E checks
        run: dotnet build modules/browser-bridge/native/launcher/BctBridgeHost.csproj -c Release
      - run: python -m unittest discover -s modules/browser-bridge/tests -p launcher_windows_e2e.py -v
      - run: python -m unittest discover -s modules/browser-bridge/tests -p pipe_windows_e2e.py -v
      - run: python -m unittest discover -s modules/browser-bridge/tests -p relay_windows_e2e.py -v

  docs-only:
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    runs-on: windows-latest
    steps:
      - run: |
          Write-Output 'Documentation-only change: executable validation intentionally skipped.'
