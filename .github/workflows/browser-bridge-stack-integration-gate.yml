name: Browser Bridge stack integration gate
on:
  push:
    branches:
      - ci/browser-bridge-stack-gate-20261021
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5cd32dcbea5c292b66423fe815a0c8bce93f70f
          persist-credentials: false
      - name: Verify exact integration commit
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne 'c5cd32dcbea5c292b66423fe815a0c8bce93f70f') { throw 'SYNTHETIC_INTEGRATION_HEAD_MISMATCH' }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Run full BCT core shard
        run: python scripts/ci_test_shard.py --start-directory tests --shard-index ${{ matrix.shard }} --shard-count 4 --durations 20
