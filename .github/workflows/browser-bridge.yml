name: Browser Bridge CI

on:
  pull_request:
    paths:
      - "modules/browser-bridge/**"
      - "src/bct/core/bridge_pr3*.py"
      - "tests/test_bridge_pr3*.py"
      - ".github/workflows/browser-bridge.yml"
  push:
    branches: [main]
    paths:
      - "modules/browser-bridge/**"
      - "src/bct/core/bridge_pr3*.py"
      - "tests/test_bridge_pr3*.py"
      - ".github/workflows/browser-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  listener:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: dotnet build modules/browser-bridge/native/launcher/BctBridgeHost.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: browser-bridge-launcher-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            modules/browser-bridge/native/launcher/bin/Release/net8.0/BctBridgeHost.exe
            modules/browser-bridge/native/launcher/bin/Release/net8.0/BctBridgeHost.dll
            modules/browser-bridge/native/launcher/bin/Release/net8.0/BctBridgeHost.deps.json
            modules/browser-bridge/native/launcher/bin/Release/net8.0/BctBridgeHost.runtimeconfig.json
          if-no-files-found: error
          retention-days: 7
      - run: python -m unittest discover -s modules/browser-bridge/tests -v
      - run: node modules/browser-bridge/tests/check_tool_protocol.cjs
      - run: python -m unittest discover -s tests -p test_bridge_pr3o_listener.py -v
      - run: python -m unittest discover -s modules/browser-bridge/tests -p test_bridge_boundary.py -v
      - run: python -m unittest discover -s modules/browser-bridge/tests -p listener_windows_e2e.py -v
      - run: python -m compileall -q src tests modules/browser-bridge
